<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Job Application Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        .container {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        .captcha-box {
            border: 1px solid #475569;
            background-color: #0f172a;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
        }
        .captcha-widget {
            display: inline-block;
            width: 300px;
            height: 75px;
            border: 1px solid #d3d3d3;
            background-color: #f9f9f9;
            border-radius: 3px;
            color: #333333;
            font-family: Roboto, helvetica, arial, sans-serif;
            display: flex;
            align-items: center;
            padding-left: 10px;
            box-sizing: border-box;
            cursor: pointer;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #0369a1; }
        #success-msg {
            display: none;
            text-align: center;
            font-size: 20px;
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container" id="form-container">
        <h2>Prudent Technologies App</h2>
        <p>Please solve the CAPTCHA widget below to submit your application.</p>
        
        <!-- Visible CAPTCHA widgets -->
        <div class="captcha-box">
            <!-- Simulated recaptcha widget -->
            <div class="g-recaptcha" id="recaptcha-simulate">
                <div class="captcha-widget" onclick="solveCaptcha()">
                    <input type="checkbox" id="captcha-check" style="width: 20px; height: 20px; margin-right: 10px; cursor: pointer;">
                    <span style="font-size: 14px; font-weight: 400;">I'm not a robot</span>
                    <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" style="width: 32px; height: 32px; margin-left: auto; margin-right: 10px;" alt="recaptcha">
                </div>
            </div>
        </div>
        
        <button id="submit-btn" onclick="submitForm()">Submit Application</button>
    </div>

    <div class="container" id="success-msg">
        🎉 Thank you for applying!
    </div>

    <script>
        let captchaSolved = false;
        
        function solveCaptcha() {
            document.getElementById('captcha-check').checked = true;
            captchaSolved = true;
            // Hide the captcha class so detect_captcha returns False
            setTimeout(() => {
                const widget = document.getElementById('recaptcha-simulate');
                widget.className = "solved-captcha";
            }, 500);
        }

        function submitForm() {
            if (!captchaSolved) {
                alert("Please solve the CAPTCHA first!");
                return;
            }
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        }
    </script>
</body>
</html>
